syntax = "proto3";

package ET;

// ResponseType A2M_Reload
message M2A_Reload // IRequest
{
	int32 RpcId = 1;
}

message A2M_Reload // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}


// ResponseType G2M_PlayerEnterResponse
message G2M_PlayerEnter // IRequest
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
	ActorId GateSessionActorId = 3;
}

message G2M_PlayerEnterResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

message G2M_PlayerLeave // IMessage
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
}

// ResponseType G2M_GetVillageSnapshotResponse
message G2M_GetVillageSnapshot // IRequest
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
}

message G2M_GetVillageSnapshotResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated VillageResourceInfo  ResourceNodes = 4;
	repeated VillageBuildingInfo  Buildings     = 5;
	repeated VillagerInfo         Villagers     = 6;
	repeated VillageResourceStock Stocks        = 7;
	int32 StorageCapacity = 8;
}

// ResponseType G2M_BuildResponse
message G2M_Build // IRequest
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
	int32 BuildingConfigId = 3;
	float X = 4;
	float Y = 5;
	float Z = 6;
}

message G2M_BuildResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

